          const base = seed();
          Object.keys(base).forEach(k => { if (s[k] == null) s[k] = base[k]; });
          return normalizeState(s);
        }
      } catch(e) {}
      const s = seed(); save(s); return normalizeState(s);

    function findDup(q){
      const phone = digits(q.phone);
      const email = String(q.email||'').trim().toLowerCase();
      const street = String(q.street||'').trim().toLowerCase();
      const community = String(q.community||'').trim().toLowerCase();

        const lp = digits(l.phone || (l.payer&&l.payer.phone));
        const le = String(l.email || (l.payer&&l.payer.email) || '').trim().toLowerCase();
        const ls = String((l.site&&l.site.street) || l.street || '').trim().toLowerCase();
        const lc = String(l.community || (l.site&&l.site.community) || '').trim().toLowerCase();
        if(phone && lp && phone.slice(-10)===lp.slice(-10)) return true;
        if(email && le && email===le) return true;
        if(street && ls && street===ls && community && lc && community===lc) return true;
        return false;

    function normalizeState(s){
      (s.leads||[]).forEach(l=>{
        if(l.stage==='Monitoring'){ l.stage='Won'; l.contract='Monitoring'; }
        if(!l.created) l.created = new Date().toISOString();
        if(l.firstTouch === undefined) l.firstTouch = l.stage==='New lead' ? '' : l.created;
        if(!l.source) l.source = 'Unknown';
        if(l.pay === undefined) l.pay = '';
        if(l.referredBy === undefined) l.referredBy = '';
        if(l.contract === undefined) l.contract = '';
        if(!l.payer) l.payer = { name:l.name||'', phone:l.phone||'', email:l.email||'', org:l.org||'' };
        if(!l.site) l.site = { street:l.street||'', community:l.community||'', unit:'', access:'see dispatch' };
        if(l.approval===undefined) l.approval = isCommercial(l.type) ? 'Pending' : 'Not required';
        if(/code\s*\d+|gate\s*\d+/i.test(l.notes||'')) l.notes = l.notes.replace(/code\s*\d+|gate\s*\d+/ig,'see dispatch');
      });
      (s.jobs||[]).forEach(j=>{
        if(/code\s*\d+|gate\s*\d+/i.test(j.notes||'')) j.notes = j.notes.replace(/code\s*\d+|gate\s*\d+/ig,'see dispatch');
      });
      (s.proposals||[]).forEach(p=>{
        const l = (s.leads||[]).find(x=>x.id===p.leadId);

      });
      return s;
    }

    function kpis(){
      const open = state.leads.filter(l=>l.stage!=='Won').length;
      const won = state.leads.filter(l=>l.stage==='Won').reduce((a,l)=>a+l.value,0);
      const pipe = state.leads.filter(l=>l.stage!=='Won').reduce((a,l)=>a+l.value,0);
      const defects = state.inspections.reduce((a,i)=>a+i.defects.length,0);
      const todayJobs = (state.jobs||[]).filter(j=>j.date===selectedDay && !['Cancelled','Complete'].includes(j.status)).length;
      const ar = (state.invoices||[]).filter(x=>x.status!=='Paid').reduce((a,x)=>a+x.total,0);
      const calls = state.calls||[];
      const missed = calls.filter(c=>c.result==='Missed'||c.result==='Abandoned').length;
      const missPct = calls.length? Math.round(missed/calls.length*100)+'%' : '—';
      const touched = state.leads.filter(l=>l.created && l.firstTouch);
      const avgMin = touched.length? Math.round(touched.reduce((a,l)=>a+((new Date(l.firstTouch)-new Date(l.created))/60000),0)/touched.length) : 0;
      const slaBreach = state.leads.filter(l=>!l.firstTouch && l.stage==='New lead').length;
      const asked = (state.reviews||[]).length;
      const atRisk = (state.agreements||[]).filter(a=>a.status==='Active' && (!leadBy(a.leadId)||!leadBy(a.leadId).pay)).length
        + (state.agreements||[]).filter(a=>a.status==='Held').length;
      return [
        { l:'Open pipeline', v:money(pipe), s:'Envelope + monitoring work' },
        { l:'Won / monitoring', v:money(won), s:'Recurring protection' },
        { l:'Stops today', v:String(todayJobs), s:selectedDay+' still open' },
        { l:'AR outstanding', v:money(ar), s:'Due + overdue' },
        { l:'Missed / abandoned', v:missPct, s:missed+' of '+(calls.length||0)+' logged calls' },
        { l:'Min to first touch', v:touched.length? String(avgMin):'—', s:slaBreach+' sitting on the 15-min SLA' },
        { l:'Review asks on file', v:String(asked), s:'Do not ask mid-callback' },
        { l:'Churn watch', v:String(atRisk), s:'Held or no pay method' }
      ];
    }

    function minutesOpen(p){
      if(!p.start) return 0;
      const [sh,sm] = p.start.split(':').map(Number);
      const end = p.end || new Date().toTimeString().slice(0,5);
      const [eh,em] = end.split(':').map(Number);
      return Math.max(0, (eh*60+em)-(sh*60+sm));
    }
    function bestFit(zone, skill, date){
      return TECHS.map(t=>{
        const stops = (state.jobs||[]).filter(j=>j.date===date && j.tech===t.id && !['Cancelled','Complete'].includes(j.status));
        const same = stops.filter(j=>j.zone===zone).length;
        const skillHit = (t.tags||[]).includes(skill)?30:0;
        const load = Math.max(0, 40 - stops.length*12);
        const score = skillHit + load + same*18;
        return { ...t, score, stops:stops.length, same, reason:(skillHit?'skill ':'')+(same?'same-zone ':'')+(load>20?'open ':'busy') };
      }).sort((a,b)=>b.score-a.score);
    }
    window.runFit = ()=>{

      const local = { id:uid('LK'), kind, jobId, sent:false, wired:false, reason:'queued', at:new Date().toISOString(), title };
      state.lark = state.lark || [];
      state.lark.unshift(local);
      save(state);
      try {
        const path = kind==='approval' ? '/lark/approval' : '/lark/notify';
        const res = await fetch(LARK_API + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ jobId, kind, job:j, title }) });
        const body = await res.json();
        local.wired = Boolean(body.wired);
        local.sent = Boolean(body.sent);
        local.reason = body.reason || (body.sent?'ok':'api-'+res.status);
        save(state);
        showToast(body.sent ? 'Lark accepted the card' : (body.wired ? 'Lark wired but chat/approval still incomplete' : 'Queued — API up, no Lark keys'));
      } catch(e) {
        local.reason = 'api-offline';
        save(state);
        showToast('Queued in OS. Start framework-ops on :8787 to talk to Lark.');
      }

    window.probeLark = async ()=>{

          <div>
            <div class="text-forest/40 text-xs tracking-[0.2em] uppercase font-semibold">Olson · phone desk</div>
            <h1 class="font-display text-4xl font-semibold">Calls</h1>
            <p class="text-sm text-forest/70">Not Lawn Phone. Log what happened until a Canadian DID with recording exists. Missed inbound is a revenue leak.</p>
          </div>
          <button onclick="logCall()" class="bg-forest text-offwhite px-4 py-2 rounded-full font-display">Log a call</button>
        </div>
        <div class="font-display text-xl mb-3">${miss} missed or abandoned of ${calls.length}</div>
        ${calls.map(c=>`
          <div class="bg-white rounded-xl p-3 border mb-2 text-sm flex justify-between">
            <div>${(c.at||'').replace('T',' ').slice(0,16)} · ${c.who} · ${c.phone}<div class="text-xs text-forest/55">${c.note||''}</div></div>
            <div>${statusChip(c.result)} ${c.minutes?c.minutes+' min':''}</div>
          </div>`).join('')||'<p class="text-sm">No calls logged.</p>'}
      `);
    }
    function viewRefer(){
      return shell(`
        <div class="flex justify-between mb-4">
          <div>
            <div class="text-forest/40 text-xs tracking-[0.2em] uppercase font-semibold">Olson · referrals</div>
            <h1 class="font-display text-4xl font-semibold">Who sent whom</h1>
            <p class="text-sm text-forest/70">Clicki is a contest engine. We log the nine-around and credit when they book. Cheaper than ads if the job was clean.</p>
          </div>
          <button onclick="addReferral()" class="bg-forest text-white px-4 py-2 rounded-full font-display">Add referral</button>
        </div>
        ${(state.referrals||[]).map(r=>{
          const from = leadBy(r.fromLead);
          return `<div class="bg-white rounded-2xl p-4 border mb-2 text-sm flex justify-between">
            <div><div class="font-display text-lg">${from?from.org:r.fromLead} → ${r.toName}</div><div class="text-xs">${r.note}</div></div>
            ${statusChip(r.status)}
          </div>`;
        }).join('')||'<p class="text-sm">None yet.</p>'}
        <h2 class="font-display text-xl mt-6 mb-2">Accounts that already named a source</h2>
        ${state.leads.filter(l=>l.referredBy||l.source==='Referral'||l.source==='Nine-around').map(l=>`
          <div class="text-sm bg-white border rounded-xl p-3 mb-1">${l.org} · ${l.source} · ${l.referredBy||'—'}</div>`).join('')}
      `);
    }
    function viewChurn(){
      const rows = (state.agreements||[]).map(a=>{
        const l = leadBy(a.leadId);
        const reasons = [];
        if(a.status==='Held') reasons.push('Seasonal hold');
        if(l && !l.pay) reasons.push('No pay method');
        if(a.next && a.next < selectedDay) reasons.push('Next date lapsed');
        const lastJob = (state.jobs||[]).filter(j=>j.leadId===a.leadId).sort((x,y)=>y.date.localeCompare(x.date))[0];
        if(!lastJob) reasons.push('No job on file');
        return { a, l, reasons, risk: reasons.length };
      }).filter(r=>r.risk);
      return shell(`
        <div class="text-forest/40 text-xs tracking-[0.2em] uppercase font-semibold">Olson · churn</div>
        <h1 class="font-display text-4xl font-semibold mb-2">Keep the book</h1>
        <p class="text-sm text-forest/70 mb-4">Small churn compounds on recurring routes. Fire a text/task here. A US churn SaaS is optional later — the list has to live in Framework first.</p>
        ${rows.map(r=>`
          <div class="bg-white rounded-2xl p-4 border border-forest/10 mb-2 flex flex-wrap justify-between gap-3">
            <div>
              <div class="font-display text-lg">${r.a.title}</div>
              <div class="text-sm">${r.l?r.l.org:r.a.leadId} · next ${r.a.next}</div>
              <div class="text-xs text-forest/40 mt-1">${r.reasons.join(' · ')}</div>
            </div>
            <button onclick="savePlay('${r.a.id}')" class="text-xs bg-forest text-white px-3 py-1 h-8 rounded-full">Queue save play</button>
          </div>`).join('')||'<p class="text-sm">No at-risk agreements on this seed.</p>'}
      `);
    }

    function enrollDrip(leadId, seq){
      state.drips = state.drips || [];
      const today = selectedDay || new Date().toISOString().slice(0,10);
      const addDays = (n)=>{ const d=new Date(today+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
      const pack = {
        newlead: [
          { step:'Same-day touch', due:today, template:'remind', seq:'newlead' },
          { step:'Day 2 quote follow', due:addDays(2), template:'quote2', seq:'quote' },
          { step:'Day 5 close-or-book', due:addDays(5), template:'quote5', seq:'quote' }
        ],
        aftercare: [
          { step:'48h aftercare', due:addDays(2), template:'aftercare', seq:'aftercare' },
          { step:'Review ask (if no callback)', due:addDays(3), template:'review', seq:'review' }
        ]
      };
      (pack[seq]||[]).forEach(s=>{
        state.drips.unshift({ id:uid('DR'), leadId, seq:s.seq, step:s.step, due:s.due, status:'Due', template:s.template });
      });
    }
    window.copyBookLink = ()=>{
      const url = (location.href.split('#')[0].split('?')[0]) + '#book';
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url);
      showToast('Book link copied: '+url);
    };
    window.submitPublicBook = (e)=>{
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target).entries());
      if(!f.pay || f.pay==='Call first'){ /* allowed */ }
      if(!f.pay){ showToast('Pick how you will pay — e-transfer, card, or call first'); return false; }
      const row = { id:uid('BK'), name:f.name, community:f.community, street:f.street||'', pest:f.pest, window:f.window, status:'New request', note:f.evidence||'', pay:f.pay, phone:f.phone, email:f.email||'', zone:f.zone };
      state.bookings.unshift(row);
      save(state);
      document.getElementById('book-ok')?.classList.remove('hidden');
      e.target.classList.add('hidden');
      return false;
    };

    function viewBookLink(){
      const url = (typeof location!=='undefined' ? location.href.split('#')[0].split('?')[0] : 'Framework-OS.html') + '#book';
      return shell(`
        <div class="text-forest/40 text-xs tracking-[0.2em] uppercase font-semibold">Instead of Cal.com / Tally</div>
        <h1 class="font-display text-4xl font-semibold mb-2">Book link</h1>
        <p class="text-sm text-forest/70 max-w-2xl mb-4">Share this with a customer or paste it on frameworkpest.ca later. Same ticket as intake. Pay method required. Office still confirms the window — this is not live calendar.</p>
        <div class="bg-white border border-forest/10 rounded-2xl p-5 mb-5">
          <div class="text-xs uppercase tracking-widest text-sage">Public URL</div>
          <div class="font-display text-lg break-all mt-1">${url}</div>
          <button onclick="copyBookLink()" class="mt-3 bg-forest text-offwhite px-4 py-2 rounded-full text-sm">Copy link</button>
          <button onclick="view='publicbook';render()" class="mt-3 ml-2 border border-sage px-4 py-2 rounded-full text-sm">Preview</button>
        </div>
        <h2 class="font-display text-xl mb-2">Queue</h2>
        ${(state.bookings||[]).map(b=>`
          <div class="bg-white rounded-xl p-3 border mb-2 text-sm flex flex-wrap justify-between gap-2">
            <div>${b.name} · ${b.community} · ${b.pest}<div class="text-xs text-forest/55">${b.window} · ${b.pay||'no pay'} · ${b.phone||''}</div></div>
            ${b.status==='New request'?`<button onclick="acceptBooking('${b.id}')" class="text-xs bg-forest text-white px-3 h-8 rounded-full">Accept to CRM</button>`:statusChip(b.status)}
          </div>`).join('')||'<p class="text-sm">Empty.</p>'}
        <p class="text-xs text-forest/50 mt-4">When ops.frameworkpest.com is live, the .ca contact form posts here. Until then this hash link is the shareable slot.</p>
      `);
    }

    function viewPublicBook(){
      return `<div class="min-h-screen bg-offwhite text-forest p-5 max-w-lg mx-auto">
        <div class="flex items-center gap-2 mb-4">${logo(32)}<div><div class="font-display font-semibold">Framework Pest</div><div class="text-xs text-forest/40">Show us what you saw</div></div></div>
        <h1 class="font-display text-3xl font-semibold">Book an inspect</h1>
        <p class="text-sm text-forest/70 mt-1 mb-4">Calgary · Airdrie · Cochrane · Chestermere · Okotoks. We confirm the window. Not a live calendar.</p>
        <form onsubmit="return submitPublicBook(event)" class="bg-white rounded-3xl p-5 border border-forest/10 grid gap-3">
          ${field('name','Your name')}
          ${field('phone','Phone')}
          <label class="text-sm">Email<input name="email" type="email" class="mt-1 w-full border border-forest/15 rounded-xl px-3 py-2 bg-offwhite"/></label>
          ${field('community','Community')}
          <label class="text-sm">Street <span class="text-forest/40">(optional)</span>
            <input name="street" class="mt-1 w-full border rounded-xl px-3 py-2 bg-offwhite"/>
          </label>
          <label class="text-sm">Zone
            <select name="zone" class="mt-1 w-full border rounded-xl px-3 py-2 bg-offwhite">${TERRITORIES.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select>
          </label>
          <label class="text-sm">What is it
            <select name="pest" class="mt-1 w-full border rounded-xl px-3 py-2 bg-offwhite">
              <option>Mice</option><option>Wasps</option><option>Ants</option><option>Bed bugs</option><option>Not sure — send a photo later</option>
            </select>
          </label>
          <label class="text-sm">What you saw
            <textarea name="evidence" rows="3" required class="mt-1 w-full border rounded-xl px-3 py-2 bg-offwhite" placeholder="Droppings, nest, bites, where…"></textarea>
          </label>
          <label class="text-sm">Window
            <select name="window" class="mt-1 w-full border rounded-xl px-3 py-2 bg-offwhite">
              <option>Weekday morning</option><option>Weekday afternoon</option><option>Same-day / after hours</option>
            </select>
          </label>
          <label class="text-sm">How you will pay
            <select name="pay" required class="mt-1 w-full border rounded-xl px-3 py-2 bg-offwhite">
              <option value="">Choose…</option>
              <option>E-transfer</option>
              <option>Card pending</option>
              <option>Call first</option>
            </select>
          </label>
          <button class="bg-forest text-offwhite rounded-full py-3 font-display font-semibold mt-1">Send to the shop</button>
        </form>
        <p id="book-ok" class="hidden mt-4 text-sm">Received. Framework will reach you from frameworkpest.ca. 825 747 5787 if it is at the door.</p>
        <p class="text-xs text-forest/45 mt-6">Residential inspect mid-band ${money(159)} + GST until the shop overwrites the card. Credit to treatment if you book within 7 days.</p>
      </div>`;
    }

    function viewFollow(){
      const rows = (state.drips||[]).slice().sort((a,b)=> (a.due||'').localeCompare(b.due||''));
      return shell(`
        <div class="flex flex-wrap justify-between gap-3 mb-4">
          <div>
            <div class="text-forest/40 text-xs tracking-[0.2em] uppercase font-semibold">Instead of HubSpot</div>
            <h1 class="font-display text-4xl font-semibold">Follow-up</h1>
            <p class="text-sm text-forest/70 max-w-2xl">Day 2 and day 5 on open quotes. 48h aftercare then a review ask — warranty desk still blocks the ask if a callback is open.</p>
          </div>
        </div>
        ${state.leads.slice(0,6).map(l=>`<button onclick="enrollDrip('${l.id}','newlead');save(state);render();showToast('Drip on ${l.org}')" class="text-[11px] border px-2 py-1 rounded-full mr-1 mb-2">Enroll ${l.org.split(' ')[0]}</button>`).join('')}
        ${rows.map(d=>{
          const l = leadBy(d.leadId);
          return `<div class="bg-white rounded-xl p-3 border mb-2 flex flex-wrap justify-between gap-2 text-sm">
            <div><div class="font-display">${l?l.org:d.leadId} · ${d.step}</div><div class="text-xs text-forest/55">due ${d.due} · ${d.seq}</div></div>
            <div>${statusChip(d.status)} ${d.status==='Due'?`<button onclick="runDrip('${d.id}')" class="ml-2 text-xs bg-forest text-white px-3 py-1 rounded-full">Queue send</button>`:''}</div>
          </div>`;
        }).join('')||'<p class="text-sm">No drips. Enroll a lead above.</p>'}
      `);
    }
    window.runDrip = (id)=>{
      const d = (state.drips||[]).find(x=>x.id===id); if(!d) return;
      const l = leadBy(d.leadId);
      if(d.template==='review'){
        const openCb = (state.reviews||[]).some(r=>r.leadId===d.leadId && r.status==='Hold');
        // warranty hold: if warranty desk has open, skip — simple check notes
        const held = (state.reviews||[]).find(r=>r.leadId===d.leadId && /hold|callback/i.test(r.note||''));
        if(held){ showToast('Warranty hold — review ask blocked'); return; }
      }
      sendTemplate(d.leadId, d.template);
      d.status = 'Sent';
      save(state); showToast((l?l.org:'')+' · '+d.step+' queued');
    };

    function render(){
      const map = {
        dashboard: viewDashboard,
        intake: viewIntake,
        crm: viewCRM,
        lead: viewLead,
        guard: viewGuard,
        sop: viewSOP,
        inspection: viewInspection,
        dispatch: viewDispatch,
        route: viewRoute,
        jobs: viewJobs,
        agreements: viewAgreements,
        billing: viewBilling,
        chem: viewChem,
        devices: viewDevices,
        inventory: viewInventory,
        suppliers: viewSuppliers,
        fleet: viewFleet,
        comms: viewComms,
        tech: viewTech,
        portal: viewPortal,
        book: viewBook,
        fit: viewFit,
        cost: viewCost,
        reviews: viewReviews,
        compliance: viewCompliance,
        lark: viewLark,
        workspace: viewWorkspace,
        id: viewID,
        brief: viewBrief,
        warranty: viewWarranty,
        density: viewDensity,
        retail: viewRetail,
        bid: viewBid,
        speed: viewSpeed,
        phone: viewPhone,
        refer: viewRefer,
        booklink: viewBookLink,
        follow: viewFollow,
        publicbook: viewPublicBook,
        churn: viewChurn,
        territory: viewTerritory,
        proposals: viewProposals,
        report: viewReport
      };
      document.getElementById('app').innerHTML = (map[view]||viewDashboard)();
    }
    window.shopOut = ()=>{ fetch('/api/logout',{method:'POST',credentials:'same-origin'}).then(()=>{ shopSession=null; showLogin(''); }); };
    const hashView = (location.hash||'').replace('#','');
    if(hashView==='book' || /[?&]book=1/.test(location.search)) view = 'publicbook';
    else if(hashView && BAYS.some(b=>b.items.some(i=>i.id===hashView))) view = hashView;
    openBay = bayOf(view);
    window.addEventListener('hashchange', ()=>{
      const next = (location.hash||'').replace('#','');
      if(next==='book'){ view='publicbook'; render(); return; }
      if(next && BAYS.some(b=>b.items.some(i=>i.id===next))) go(next);
    });
    try { render(); } catch(err) {
      document.getElementById('app').innerHTML = '<div style="padding:24px;font-family:sans-serif;background:#F4F2EC;color:#15361E"><h1>Framework OS hit an error</h1><pre style="white-space:pre-wrap">'+String(err)+'</pre></div>';
    }
    async function boot(){
      if(view==='publicbook') return;
      try {
        const ses = await fetch('/api/session', { credentials:'same-origin' });
        const type = ses.headers.get('content-type') || '';
        if(ses.ok && type.includes('json')){
          const data = await ses.json();
          if(data.ok){ await startShop(); return; }
          showLogin('');
          return;
        }
        render();
      } catch(err) {
        try { render(); } catch(e) {
          document.getElementById('app').innerHTML = '<div style="padding:24px;font-family:sans-serif;background:#F4F2EC;color:#15361E"><h1>Framework OS hit an error</h1><pre style="white-space:pre-wrap">'+String(e)+'</pre></div>';
        }
      }
    }
    boot();
  </script>
</body>
</html>
